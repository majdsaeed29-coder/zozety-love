name: Build Zozety Love APK

on:
  workflow_dispatch:  # تشغيل يدوي فقط

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. تحميل الكود
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # 2. إعداد Java (بدون distribution خطأ)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'  # ✅ إضافة مطلوبة
    
    # 3. تثبيت Gradle إذا محتاج
    - name: Setup Gradle
      run: |
        # تحقق إذا gradle مثبت، إذا لا، ثبت آخر إصدار
        if ! command -v gradle &> /dev/null; then
          echo "Installing Gradle..."
          sudo apt-get update
          sudo apt-get install -y gradle
        fi
        gradle --version
    
    # 4. البناء مباشرة باستخدام gradle (بدون gradlew)
    - name: Build APK with Gradle
      run: |
        echo "=== بداية البناء ==="
        
        # اذهب لمجلد app وابن مباشرة
        cd app
        
        # اختبار: اعرض محتويات build.gradle
        echo "=== محتوى build.gradle ==="
        head -20 build.gradle
        
        # البناء مع عرض الأخطاء فقط
        echo "=== جارٍ البناء... ==="
        gradle assembleDebug --stacktrace 2>&1 | grep -E "(FAILED|ERROR|SUCCESS|BUILD)" || true
        
        # تحقق إذا الـ APK تم إنشاؤه
        echo "=== البحث عن APK ==="
        if [ -f "build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ تم بناء APK بنجاح!"
          ls -lh build/outputs/apk/debug/
        else
          echo "❌ APK غير موجود"
          find . -name "*.apk" -type f
        fi
    
    # 5. رفع الـ APK إذا نجح البناء
    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ZozetyLove-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
    
    # 6. إذا فشل البناء، ارفع التقارير
    - name: Upload Build Reports on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Failure-Reports
        path: |
          app/build/reports/
          app/build/outputs/logs/
        retention-days: 3
