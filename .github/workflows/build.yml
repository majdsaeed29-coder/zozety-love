name: Build Zozety Love APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
      
    # الحل: إنشاء gradlew تلقائيًا إذا لم يكن موجودًا
    - name: Generate gradlew if missing
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "gradlew not found, generating wrapper..."
          ./gradle/wrapper/gradlew wrapper --gradle-version 8.5
        else
          echo "gradlew exists, continuing..."
        fi
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Zozety-Love-APK
        path: app/build/outputs/apk/debug/app-debug.apk
