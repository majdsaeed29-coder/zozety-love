name: Android Build and Test

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Create icons
      run: |
        chmod +x create_icons.sh
        ./create_icons.sh
    
    - name: Create required directories
      run: |
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/raw
        
        # إنشاء ملف الموسيقى الوهمي
        echo "This is a dummy music file" > app/src/main/res/raw/love_song.mp3
        
        # إنشاء ملفات XML المطلوبة في drawable
        cat > app/src/main/res/drawable/ic_heart.xml << 'EOF'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp"
            android:height="24dp"
            android:viewportWidth="24"
            android:viewportHeight="24">
            <path
                android:fillColor="#E91E63"
                android:pathData="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z"/>
        </vector>
        EOF
        
        cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android"
            android:shape="rectangle">
            <solid android:color="#E91E63" />
        </shape>
        EOF
        
        cat > app/src/main/res/drawable/edittext_background.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@android:color/white" />
            <stroke android:width="2dp" android:color="@color/primary_color" />
            <corners android:radius="12dp" />
            <padding android:left="16dp" android:top="12dp" android:right="16dp" android:bottom="12dp" />
        </shape>
        EOF
        
        # إنشاء مجلدات res الإضافية
        mkdir -p app/src/main/res/drawable-hdpi
        mkdir -p app/src/main/res/drawable-mdpi
        mkdir -p app/src/main/res/drawable-xhdpi
        mkdir -p app/src/main/res/drawable-xxhdpi
        mkdir -p app/src/main/res/drawable-xxxhdpi
        mkdir -p app/src/main/res/values-night
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
    
    - name: Grant execute permission for gradlew
      run: |
        chmod +x gradlew
        chmod +x app/gradlew
    
    - name: Clean project
      run: |
        ./gradlew clean
    
    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --info
    
    - name: Build Release APK
      run: |
        ./gradlew assembleRelease --stacktrace --info
    
    - name: Run tests
      run: |
        ./gradlew testDebugUnitTest
        ./gradlew connectedDebugAndroidTest || echo "Tests completed (some may have failed)"
    
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/
        retention-days: 7
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: release-apk
        path: app/build/outputs/apk/release/
        retention-days: 7
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          app/build/test-results/
          app/build/reports/
        retention-days: 7
