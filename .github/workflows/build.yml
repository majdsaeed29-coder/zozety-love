name: Debug Build Location

on: [workflow_dispatch]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build and Search
      run: |
        # تثبيت gradle وبناء
        sudo apt update && sudo apt install -y gradle
        cd app
        gradle assembleDebug
        
        # بحث شامل
        echo "=== بحث شامل ==="
        echo "1. كل ملفات apk:"
        find . -name "*.apk" -type f
        
        echo ""
        echo "2. هيكل مجلد build:"
        ls -la build/
        
        echo ""
        echo "3. مجلد outputs:"
        find build/outputs/ -type f 2>/dev/null || echo "لا يوجد outputs"
        
        echo ""
        echo "4. هل bundle موجود؟"
        gradle tasks 2>&1 | grep -i "bundle\|apk"
