name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من الريبو
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. إعداد JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 🔴 **إصلاح: إنشاء الملفات الناقصة أولاً**
      - name: Fix Missing Files
        run: |
          echo "=== إصلاح الملفات الناقصة ==="
          
          # 1. إنشاء مجلد raw وملف الموسيقى الوهمي (مهم جداً)
          mkdir -p app/src/main/res/raw
          echo "# Dummy audio file for Zozety Love" > app/src/main/res/raw/love_song.mp3
          
          # 2. إنشاء ملف خلفية الأيقونة إذا ناقص
          if [ ! -f "app/src/main/res/drawable/ic_launcher_background.xml" ]; then
            cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@color/primary_color" />
              <corners android:radius="50dp" />
          </shape>
          EOF
            echo "✅ Created ic_launcher_background.xml"
          fi
          
          # 3. إنشاء gradlew إذا ناقص (بدون ملفات معقدة)
          if [ ! -f "gradlew" ]; then
            echo "#!/bin/bash" > gradlew
            echo 'gradle "$@"' >> gradlew
            chmod +x gradlew
            echo "✅ Created simple gradlew"
          fi
          
          echo "=== تم إصلاح الملفات الناقصة ==="

      # 4. 🔴 **تغيير: استخدام gradle مباشرة بدل gradlew**
      - name: Build Debug APK
        run: |
          echo "=== بدء البناء ==="
          
          # اختبار إذا gradle مثبت
          if command -v gradle &> /dev/null; then
            echo "Gradle مثبت، جاري البناء..."
          else
            echo "تثبيت Gradle..."
            sudo apt-get update
            sudo apt-get install -y gradle
          fi
          
          # البناء مباشرة باستخدام gradle (بدون wrapper)
          cd app
          gradle assembleDebug --stacktrace 2>&1 | tail -100
          
          # التحقق من وجود APK
          if [ -f "build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ ✅ ✅ تم بناء APK بنجاح!"
            ls -lh build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK غير موجود"
            echo "=== آخر 50 سطر من الـ logs ==="
            gradle assembleDebug --stacktrace 2>&1 | tail -50
          fi

      # 5. رفع الـ APK كـ artifact
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zozety-love.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
      # 6. 🔴 **إضافة: رفع تقارير الخطأ إذا فشل**
      - name: Upload Error Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
