name: Build zozety love apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Build APK
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug || ./gradlew build
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: zozety-love-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
    - name: Upload to Appetize (Optional)
      if: success()
      run: |
        echo "APK built successfully!"
        echo "Download it from the Artifacts section"
        echo "Then upload manually to: https://appetize.io/upload"
