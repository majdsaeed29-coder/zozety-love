name: Simple Build Test

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup
        run: |
          echo "Checking project structure..."
          ls -la
          echo "Checking app directory..."
          ls -la app/ || echo "No app directory"
          
      - name: Create minimal files
        run: |
          # فقط الملفات الضرورية
          mkdir -p app/src/main/res/raw
          echo "test" > app/src/main/res/raw/love_song.mp3
          
      - name: Try gradle
        run: |
          # إذا كان gradlew موجوداً
          if [ -f "gradlew" ]; then
            echo "Found gradlew, trying to build..."
            chmod +x gradlew
            ./gradlew tasks --no-daemon 2>&1 | head -50
          else
            echo "gradlew not found, project may need gradle wrapper"
          fi
