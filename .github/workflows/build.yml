[file content begin]
name: Android Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Generate Gradle Wrapper
      run: |
        # 1. تثبيت Gradle
        sudo apt-get update
        sudo apt-get install -y gradle
        
        # 2. إنشاء gradlew wrapper
        echo "Generating gradle wrapper..."
        cat > gradlew << 'EOF'
#!/usr/bin/env bash
##############################################################################
##  Gradle start up script for UN*X
##############################################################################
# Add default JVM options here
DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'
# Resolve links: $0 may be a link
PRG="$0"
while [ -h "$PRG" ] ; do
  ls=$(ls -ld "$PRG")
  link=$(expr "$ls" : '.*-> \(.*\)$')
  if expr "$link" : '/.*' > /dev/null; then
    PRG="$link"
  else
    PRG=$(dirname "$PRG")"/$link"
  fi
done
SCRIPT=$(readlink -f "$0")
SCRIPTPATH=$(dirname "$SCRIPT")
APP_HOME=$(cd "$SCRIPTPATH/.." && pwd)
exec "$JAVA_HOME/bin/java" $DEFAULT_JVM_OPTS -jar "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" "$@"
EOF
        
        chmod +x gradlew
        
        # 3. إنشاء مجلد wrapper وملف gradle-wrapper.properties
        mkdir -p gradle/wrapper
        
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
        
        # 4. تحميل gradle-wrapper.jar
        wget -q https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar -P gradle/wrapper/ || true
        
        echo "✅ Gradle wrapper created"
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Create missing files
      run: |
        # إنشاء جميع الملفات المطلوبة من أكوادك
        echo "Creating project structure..."
        
        # 1. مجلدات الموارد
        mkdir -p app/src/main/res/{drawable,layout,values,raw,mipmap-hdpi,mipmap-mdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi}
        
        # 2. ملف الصوت
        echo "dummy audio" > app/src/main/res/raw/love_song.mp3
        
        # 3. الأيقونات البسيطة
        for density in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
          echo '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android"></vector>' > "app/src/main/res/mipmap-$density/ic_launcher.xml"
          echo '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android"></vector>' > "app/src/main/res/mipmap-$density/ic_launcher_round.xml"
        done
        
        # 4. ملف colors.xml إذا لم يكن موجوداً
        if [ ! -f "app/src/main/res/values/colors.xml" ]; then
          cat > app/src/main/res/values/colors.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="primary_color">#E91E63</color>
</resources>
EOF
        fi
        
        echo "✅ Project files created"
    
    - name: Build the project
      run: |
        echo "Starting build process..."
        
        # محاولة البناء
        if [ -f "gradlew" ]; then
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace --no-daemon
        else
          # استخدام gradle مباشرة
          gradle clean
          gradle assembleDebug --stacktrace
        fi
        
        echo "Build completed!"
    
    - name: Check APK
      run: |
        echo "🔍 Searching for APK files..."
        
        if find . -name "*.apk" -type f 2>/dev/null | grep -q .; then
          echo "✅ APK found!"
          find . -name "*.apk" -type f | head -5
          ls -lh $(find . -name "*.apk" -type f | head -1) 2>/dev/null || true
        else
          echo "⚠️ No APK found, checking build output..."
          ls -la app/build/outputs/ 2>/dev/null || echo "No build outputs"
        fi
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: zozety-love-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
[file content end]
