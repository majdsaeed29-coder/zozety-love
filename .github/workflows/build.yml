name: Android Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. جلب الكود
    - uses: actions/checkout@v4
    
    # 2. تثبيت Java و Gradle
    - name: Setup Java & Gradle
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk gradle
        
    # 3. 🔥 إصلاح الملفات الناقصة (السبب الرئيسي للفشل)
    - name: Fix Missing Files
      run: |
        echo "=== Fixing Android project ==="
        
        # 1. ملف الصوت - ضروري
        mkdir -p app/src/main/res/raw
        echo "dummy audio" > app/src/main/res/raw/love_song.mp3
        
        # 2. ملف خلفية الأيقونة
        cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android"
            android:shape="rectangle">
            <solid android:color="@color/primary_color" />
        </shape>
        EOF
        
        # 3. ألوان إضافية
        echo '    <color name="primary_light">#F48FB1</color>' >> app/src/main/res/values/colors.xml 2>/dev/null || echo "Colors.xml exists"
        
        echo "✅ All files fixed"
    
    # 4. 🔥 البناء المباشر
    - name: Build Android APK
      run: |
        echo "=== Building Android APK ==="
        cd app
        
        # نظف أولاً
        rm -rf build/ 2>/dev/null || true
        
        # ابنِ
        gradle assembleDebug 2>&1
        
        # ابحث عن APK
        APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "✅ ✅ ✅ APK BUILT SUCCESSFULLY!"
          echo "📱 APK Location: $APK"
          echo "📦 Size: $(ls -lh "$APK" | awk '{print $5}')"
          echo "APK_PATH=$APK" >> $GITHUB_ENV
        else
          echo "❌ APK not found"
          echo "Last build output:"
          gradle assembleDebug 2>&1 | tail -30
        fi
    
    # 5. رفع APK
    - name: Upload APK
      if: env.APK_PATH != ''
      uses: actions/upload-artifact@v4
      with:
        name: zozety-love.apk
        path: ${{ env.APK_PATH }}
