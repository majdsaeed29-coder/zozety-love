name: FINAL ATTEMPT - Build or Die

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. جلب الكود فقط
    - uses: actions/checkout@v4
    
    # 2. تثبيت الأدوات دفعة واحدة
    - name: INSTALL EVERYTHING
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk gradle wget unzip
        
    # 3. إصلاح الملفات الناقصة دفعة واحدة
    - name: FIX ALL FILES
      run: |
        # 1. ملف الموسيقى
        mkdir -p app/src/main/res/raw
        echo "dummy" > app/src/main/res/raw/love_song.mp3
        
        # 2. ملف خلفية الأيقونة
        cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android"
            android:shape="rectangle">
            <solid android:color="@color/primary_color" />
        </shape>
        EOF
        
        # 3. إصلاح SecureStorage.kt
        sed -i 's/mapOf(/mapOf<String, Any>(/g' app/src/main/java/com/zozety/love/utils/SecureStorage.kt 2>/dev/null || true
        
        # 4. إضافة colors الناقصة
        echo '    <color name="primary_light">#F48FB1</color>' >> app/src/main/res/values/colors.xml 2>/dev/null || true
        
    # 4. البناء - آخر محاولة
    - name: BUILD OR DIE
      run: |
        cd app
        echo "=== BUILD START ==="
        
        # محاولة البناء الأولى
        gradle assembleDebug 2>&1 | tail -100
        
        echo "=== BUILD END ==="
        
        # ابحث عن APK
        APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "✅ APK FOUND: $APK"
          echo "APK_PATH=$APK" >> $GITHUB_ENV
        else
          echo "❌ NO APK - Listing build dir:"
          ls -la build/ 2>/dev/null || echo "No build dir"
        fi
    
    # 5. رفع إذا وجد
    - name: UPLOAD IF EXISTS
      if: env.APK_PATH != ''
      uses: actions/upload-artifact@v4
      with:
        name: zozety-apk
        path: ${{ env.APK_PATH }}
