name: Build Zozety
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
    
    - name: Create Missing Files
      run: |
        mkdir -p app/src/main/res/raw
        echo "dummy" > app/src/main/res/raw/love_song.mp3
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
    
    - name: Build APK
      run: |
        # تثبيت gradle
        sudo apt update
        sudo apt install -y gradle
        
        # بناء المشروع
        echo "بداية البناء..."
        cd app
        gradle clean
        gradle assembleDebug --stacktrace 2>&1 || echo "البناء فشل"
        
        # شوف إذا في APK
        if ls build/outputs/apk/debug/*.apk 1>/dev/null 2>&1; then
          echo "✅ نجح! في APK"
          ls -lh build/outputs/apk/debug/*.apk
        else
          echo "❌ فشل! ما في APK"
          find . -name "*.log" -type f | head -3
        fi
