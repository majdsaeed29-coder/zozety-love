[file name]: .github/workflows/build.yml
[file content begin]
name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      run: |
        # تثبيت Android SDK Command Line Tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-*.zip -d android-sdk
        rm commandlinetools-linux-*.zip
        
        # إنشاء المجلدات المطلوبة
        mkdir -p android-sdk/cmdline-tools/latest
        mv android-sdk/cmdline-tools/* android-sdk/cmdline-tools/latest/
        
        # إضافة إلى PATH
        echo "$(pwd)/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$(pwd)/android-sdk/platform-tools" >> $GITHUB_PATH
        
        # قبول التراخيص
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
    - name: Prepare project files
      run: |
        # إنشاء الملفات المفقودة
        mkdir -p app/src/main/res/raw
        echo "dummy" > app/src/main/res/raw/love_song.mp3
        
        # إنشاء أيقونات
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        
        for folder in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
          echo "<vector></vector>" > "app/src/main/res/mipmap-$folder/ic_launcher.xml"
          echo "<vector></vector>" > "app/src/main/res/mipmap-$folder/ic_launcher_round.xml"
        done
        
        # تأكد من وجود ملف gradle wrapper
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found, downloading..."
          wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          chmod +x gradlew
        fi
        
        # إنشاء ملف local.properties
        echo "sdk.dir=$(pwd)/android-sdk" > local.properties
        
    - name: Make gradlew executable
      run: chmod +x gradlew || true
        
    - name: Build with Gradle
      run: |
        # تنظيف أولاً
        ./gradlew clean --no-daemon
        
        # بناء نسخة debug
        ./gradlew assembleDebug --no-daemon --stacktrace
        
    - name: List generated APKs
      run: |
        echo "=== Generated APKs ==="
        find . -name "*.apk" -type f | while read file; do
          echo "APK found: $file"
          ls -lh "$file"
        done
        
        echo "=== Build directory ==="
        ls -la app/build/outputs/apk/ || echo "No APK directory found"
        
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ZozetyLove-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
[file content end]
