name: Build Zozety Love
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # هذا يساعد في تسريع البناء

      - name: 🛠️ Setup Android SDK (Automated)
        uses: android-actions/setup-android@v3
        with:
          # سيتم تنزيل الأدوات المناسبة تلقائياً. لإصدارات حديثة.
          cmdline-tools-version: '11.0' # أو 'latest'[citation:7]

      - name: 🔨 Prepare Project Files
        run: |
          mkdir -p app/src/main/res/raw
          echo "dummy audio" > app/src/main/res/raw/love_song.mp3
          echo "✅ Essential files ready"

      - name: 🏗️ Build the App
        run: |
          # استخدم `gradlew` الخاص بمشروعك، أو قم بإنشاء واحد بسيط إذا لم يكن موجوداً.
          # سيستخدم Gradle الأداة التي تم إعدادها في الخطوة السابقة.
          ./gradlew clean assembleDebug --stacktrace

      - name: 📦 Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zozety-Love-APK
          path: app/build/outputs/apk/debug/*.apk
