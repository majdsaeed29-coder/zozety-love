name: Build Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js
      - name: Setup Node.js
        if: ${{ hashFiles('**/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build (npm)
        if: ${{ hashFiles('**/package.json') != '' }}
        run: |
          npm ci || true
          if npm run | grep -q build; then npm run build; fi

      # Python
      - name: Setup Python
        if: ${{ hashFiles('**/requirements.txt') != '' || hashFiles('**/pyproject.toml') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install & Build (Python)
        if: ${{ hashFiles('**/requirements.txt') != '' || hashFiles('**/pyproject.toml') != '' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install build && python -m build; fi

      # Java (Maven)
      - name: Setup Java
        if: ${{ hashFiles('**/pom.xml') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Maven
        if: ${{ hashFiles('**/pom.xml') != '' }}
        run: mvn -B -DskipTests package

      # Gradle
      - name: Build with Gradle
        if: ${{ hashFiles('**/build.gradle') != '' || hashFiles('**/settings.gradle') != '' }}
        run: ./gradlew build || gradle build

      # Go
      - name: Setup Go
        if: ${{ hashFiles('**/go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Go
        if: ${{ hashFiles('**/go.mod') != '' }}
        run: go build ./...

      # Rust
      - name: Setup Rust
        if: ${{ hashFiles('**/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust
        if: ${{ hashFiles('**/Cargo.toml') != '' }}
        run: cargo build --release
