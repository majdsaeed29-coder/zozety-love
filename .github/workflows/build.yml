
name: Android Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Essential Files
      run: |
        # الملفات التي ذكرت أنها ضرورية للبناء
        mkdir -p app/src/main/res/raw
        echo "dummy" > app/src/main/res/raw/love_song.mp3

        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/layout

    - name: Prepare Gradle Wrapper
      run: |
        # التأكد من وجود ملف Gradle Wrapper التنفيذي الصحيح
        if [ -f gradlew ]; then
          chmod +x gradlew
          echo "✅ gradlew exists and is executable."
        else
          echo "❌ gradlew not found. Workflow will likely fail."
        fi

    - name: Clean Project
      run: ./gradlew clean --no-daemon

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: List APK Artifacts
      run: |
        echo "Searching for APK files..."
        find . -name "*.apk" -type f
