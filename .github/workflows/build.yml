name: LAST TRY - إما يشتغل أو أنا أبني لك

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # لا تحتاج تخزين ولا cache ولا شي
    - name: 🚀 البناء المباشر
      run: |
        # 1. تثبيت الأدوات دفعة واحدة
        apt-get update
        apt-get install -y wget unzip openjdk-17-jdk
        
        # 2. نزل Gradle بس
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export PATH=$PWD/gradle-8.5/bin:$PATH
        
        # 3. ابنِ مباشرة
        cd app
        gradle assembleDebug --no-daemon --stacktrace
        
        # 4. لو نجح، روح ارفع
        if [ $? -eq 0 ]; then
          echo "🎉 BUILD SUCCESS"
          find . -name "*.apk" -type f
        else
          echo "❌ BUILD FAILED"
          exit 1
        fi
    
    # رفع الناتج
    - name: ⬆️ رفع الـ APK
      uses: actions/upload-artifact@v4
      with:
        name: zozety-apk
        path: app/build/outputs/apk/debug/*.apk
