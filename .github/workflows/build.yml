name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من الريبو
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. إعداد JDK (مطلوب للأندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. تثبيت Gradle إذا مش موجود
      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      # 4. بناء نسخة Debug APK باستخدام Gradle مباشرة
      - name: Build Debug APK
        run: |
          cd app
          gradle assembleDebug

      # 5. رفع الـ APK كـ artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zozety-love.apk
          path: app/build/outputs/apk/debug/app-debug.apk
