name: Build Without Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle
        
    - name: Install Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
    
    - name: Prepare project
      run: |
        # إنشاء الملفات المطلوبة
        mkdir -p app/src/main/res/raw
        echo "dummy" > app/src/main/res/raw/love_song.mp3
        
        # إنشاء أيقونات وهمية
        for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          mkdir -p "app/src/main/res/mipmap-$density"
          echo '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android"></vector>' > "app/src/main/res/mipmap-$density/ic_launcher.xml"
        done
    
    - name: Build with Gradle
      run: |
        # استخدام gradle مباشرة بدون wrapper
        cd app
        gradle assembleDebug
        
    - name: Find APK
      run: |
        echo "Looking for APK files..."
        find . -name "*.apk" -type f
