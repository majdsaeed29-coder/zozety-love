name: Zozety Love Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 🛠️ Fix project structure
      run: |
        echo "=== Creating essential files ==="
        
        # 1. ملف الصوت المطلوب
        mkdir -p app/src/main/res/raw
        echo "dummy" > app/src/main/res/raw/love_song.mp3
        
        # 2. أيقونات بسيطة
        for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          mkdir -p "app/src/main/res/mipmap-$density"
          echo '<vector/>' > "app/src/main/res/mipmap-$density/ic_launcher.xml"
        done
        
        # 3. إصلاح السطر 33: local.properties بدل إنشاء ملفات متعددة
        echo "Creating Android SDK configuration..."
        mkdir -p ~/.android || true
        touch local.properties 2>/dev/null || echo "local.properties not needed"
        
        echo "✅ Files created successfully"
    
    - name: 🏗️ Build APK
      run: |
        echo "=== Building APK ==="
        
        # استخدام Gradle مباشرة بدون wrapper
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        
        # بناء المشروع
        ./gradle-8.5/bin/gradle -p app clean
        ./gradle-8.5/bin/gradle -p app assembleDebug --stacktrace
        
        echo "✅ Build attempt completed"
    
    - name: 📊 Check results
      run: |
        echo "=== Checking for APK ==="
        
        # ابحث عن أي APK
        find . -name "*.apk" -type f 2>/dev/null | while read apk; do
          echo "🎉 Found APK: $apk"
          ls -lh "$apk"
        done
        
        # إذا ما في APK، شوف شو صار
        if [ ! -f "$(find . -name "*.apk" -type f 2>/dev/null | head -1)" ]; then
          echo "⚠️ No APK found, showing build logs..."
          find . -name "*.log" -type f | head -3
        fi
