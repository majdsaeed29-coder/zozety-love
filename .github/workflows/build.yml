name: Build Zozety Love
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Create essential files
      run: |
        echo "Creating only the absolutely necessary files..."
        mkdir -p app/src/main/res/raw
        echo "dummy audio" > app/src/main/res/raw/love_song.mp3
        
        # Create minimal icons
        for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          mkdir -p "app/src/main/res/mipmap-$d"
          echo '<vector/>' > "app/src/main/res/mipmap-$d/ic_launcher.xml"
        done
        
        # Ensure local.properties exists
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties 2>/dev/null || true
    
    - name: Download and use Gradle 8.5
      run: |
        echo "Downloading Gradle 8.5..."
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        
        echo "Building project..."
        ./gradle-8.5/bin/gradle -p app clean assembleDebug --stacktrace --no-daemon
    
    - name: Check for APK
      run: |
        echo "Looking for APK files..."
        find . -name "*.apk" -type f
        
        if ls app/build/outputs/apk/debug/*.apk 1>/dev/null 2>&1; then
          echo "✅ SUCCESS! APK created."
          ls -lh app/build/outputs/apk/debug/*.apk
        else
          echo "❌ No APK found"
          echo "Build directory contents:"
          ls -la app/build/ 2>/dev/null || echo "No build directory"
        fi
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: zozety-apk
        path: app/build/outputs/apk/debug/*.apk
