name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update && sudo apt install -y gradle
      - run: |
          mkdir -p app/src/main/res/raw
          echo "dummy" > app/src/main/res/raw/love_song.mp3
      - run: gradle clean && gradle assembleDebug
