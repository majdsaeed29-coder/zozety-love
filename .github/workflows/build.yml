[file name]: .github/workflows/ultimate-build.yml
name: Ultimate Android Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # الخطوة 1: جلب الأكواد
    - uses: actions/checkout@v4
    
    # الخطوة 2: تثبيت الأدوات الأساسية
    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y wget unzip openjdk-17-jdk
    
    # الخطوة 3: إنشاء هيكل المشروع من أكوادك
    - name: Setup project structure
      run: |
        # فقط أنشئ الملفات الضرورية جداً
        mkdir -p app/src/main/res/raw
        echo "dummy" > app/src/main/res/raw/love_song.mp3
        
        # ملف build.gradle الأساسي إذا كان ناقصاً
        if [ ! -f "app/build.gradle" ]; then
          echo "Creating minimal build.gradle..."
          cat > app/build.gradle << 'EOF'
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zozety.love'
    compileSdk 34
    defaultConfig {
        applicationId "com.zozety.love"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
EOF
        fi
    
    # الخطوة 4: بناء باستخدام Gradle مباشرة بدون wrapper
    - name: Direct Gradle Build
      run: |
        echo "Downloading Gradle..."
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export PATH=$PWD/gradle-8.5/bin:$PATH
        
        echo "Building with Gradle..."
        gradle clean
        gradle assembleDebug
        
        echo "Checking results..."
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK"
    
    # الخطوة 5: النتيجة النهائية
    - name: Final Check
      run: |
        echo "=== BUILD FINISHED ==="
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "🎉 SUCCESS! APK created."
          du -h app/build/outputs/apk/debug/app-debug.apk
        else
          echo "⚠️ Build may have issues, but process completed."
          find . -name "*.apk" -type f 2>/dev/null || echo "No APKs generated"
        fi
[file content end]
