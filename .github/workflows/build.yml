name: Build Zozety Love APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        wget -q https://github.com/gradle/gradle/raw/rel/v8.5/wrapper/gradle-wrapper.jar -P gradle/wrapper/
      
    - name: Make gradlew executable
      run: |
        if [ ! -f "./gradlew" ]; then
          wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          chmod +x ./gradlew
        fi
        chmod +x ./gradlew
        
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Zozety-Love-APK
        path: app/build/outputs/apk/debug/app-debug.apk
