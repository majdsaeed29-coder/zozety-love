name: Build APK for Zozety Love

on:
  workflow_dispatch:  # لتشغيله يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    # الخطوة الجديدة: تحميل gradlew إذا كان مفقوداً
    - name: Setup Gradle Wrapper
      run: |
        # 1. أنشئ هيكل المجلدات
        mkdir -p gradle/wrapper
        
        # 2. حمّل gradlew إذا كان مفقوداً
        if [ ! -f "gradlew" ]; then
          echo "Downloading gradlew..."
          curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          chmod +x gradlew
        fi
        
        # 3. حمّل ملفات wrapper الأساسية
        if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          echo "Creating gradle-wrapper.properties..."
          echo 'distributionBase=GRADLE_USER_HOME' > gradle/wrapper/gradle-wrapper.properties
          echo 'distributionPath=wrapper/dists' >> gradle/wrapper/gradle-wrapper.properties
          echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip' >> gradle/wrapper/gradle-wrapper.properties
          echo 'zipStoreBase=GRADLE_USER_HOME' >> gradle/wrapper/gradle-wrapper.properties
          echo 'zipStorePath=wrapper/dists' >> gradle/wrapper/gradle-wrapper.properties
        fi
        
    - name: Build APK
      run: ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: zozety-love-apk
        path: app/build/outputs/apk/debug/app-debug.apk
